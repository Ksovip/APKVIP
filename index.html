<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSOVIP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        /* အခြေခံ Setting များ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* လှုပ်ရှားနေမည့် အန်နီမေးရှင်း နောက်ခံ */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientAnimation 12s ease infinite;
            color: white;
            padding: 20px;
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* စာသားနှင့် ခလုပ်ထည့်မည့် ဘောင် (Card Container) */
        .main-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1); 
            padding: 35px 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 430px;
            width: 100%;
        }

        /* ခေါင်းစဉ် KSOVIP စတိုင် */
        h1 {
            font-size: 3rem;
            margin-bottom: 25px;
            letter-spacing: 3px;
            text-shadow: 2px 4px 10px rgba(0, 0, 0, 0.3);
            font-weight: bold;
            cursor: default;
            user-select: none; 
            -webkit-user-select: none;
        }

        /* ဒေါင်းလုဒ် ခလုပ်စတိုင် */
        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 15px 25px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 5px 15px rgba(255, 75, 43, 0.4);
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }
        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 75, 43, 0.6);
        }

        /* တိုက်ရိုက်စာရေးရန် နေရာ စတိုင် */
        .chat-section {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 15px;
            text-align: left;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-box {
            width: 100%;
            height: 80px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 10px;
            color: white;
            font-size: 0.95rem;
            resize: none;
            outline: none;
        }

        .send-btn {
            width: 100%;
            background: #23d5ab;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .send-btn:hover { background: #1ebfa2; }

        /* Admin ဆက်သွယ်ရန် နေရာ စတိုင် */
        .admin-section {
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 22px;
        }

        .admin-title {
            font-size: 0.95rem;
            margin-bottom: 15px;
            color: #f0f0f0;
            letter-spacing: 1px;
            text-align: center;
        }

        .contact-links {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .contact-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 15px;
            font-size: 0.9rem;
            font-weight: 600;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .tg-btn { background-color: #0088cc; }
        .tg-btn:hover { background-color: #0077b3; transform: translateY(-2px); }

        .msg-btn { background-color: #006aff; }
        .msg-btn:hover { background-color: #0056cc; transform: translateY(-2px); }

        /* လျှို့ဝှက် Admin Panel */
        .admin-panel {
            display: none;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 12px;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-top: 20px;
        }

        .msg-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.9rem;
            border-left: 3px solid #ff416c;
            word-break: break-all;
        }

        .clear-btn {
            background: #ff4b2b;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 50px;
            font-size: 0.75rem;
            cursor: pointer;
            float: right;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h1 onclick="handleHeaderClick()">KSOVIP</h1>
        
        <a href="#" class="download-btn">
            <i class="fa-solid fa-cloud-arrow-down"></i> DOWNLOAD NOW
        </a>

        <div class="chat-section">
            <p class="chat-title"><i class="fa-solid fa-pen-to-square"></i> တိုက်ရိုက် စာရေးရန်</p>
            <textarea id="userMessage" class="chat-box" placeholder="ဒီနေရာမှာ စာရိုက်ပြီး ပို့နိုင်ပါတယ်..."></textarea>
            <button type="button" class="send-btn" onclick="saveMessage()">
                <i class="fa-solid fa-paper-plane"></i> Send Message
            </button>
        </div>

        <div class="admin-section">
            <p class="admin-title"><i class="fa-solid fa-headset"></i> Contact Admin</p>
            <div class="contact-links">
                <a href="https://t.me/your_telegram_username" target="_blank" class="contact-btn tg-btn">
                    <i class="fa-brands fa-telegram"></i> Telegram
                </a>
                <a href="https://m.me/your_facebook_username" target="_blank" class="contact-btn msg-btn">
                    <i class="fa-brands fa-facebook-messenger"></i> Messenger
                </a>
            </div>
        </div>

        <div id="adminPanel" class="admin-panel">
            <div style="margin-bottom: 10px; height: 20px;">
                <span style="font-size: 0.85rem; font-weight: bold; color: #23d5ab;"><i class="fa-solid fa-unlock"></i> ဝင်လာသော စာများ-</span>
                <button class="clear-btn" onclick="clearMessages()">စာအားလုံးဖျက်ရန်</button>
            </div>
            <div id="messageList">
                </div>
        </div>
    </div>

    <script>
        let backupMessages = [];

        window.onload = function() {
            displayMessages();
        };

        let clickCount = 0;
        let clickTimeout;

        function handleHeaderClick() {
            clickCount++;
            clearTimeout(clickTimeout);

            if (clickCount === 3) {
                clickCount = 0; 
                loginAdmin(); // လက်ဗွေ သို့မဟုတ် Password စစ်ဆေးရန် သွားမည်
            } else {
                clickTimeout = setTimeout(() => {
                    clickCount = 0;
                }, 1000);
            }
        }

        // WebAuthn အတွက် Buffer ပြောင်းလဲပေးသည့် Utility Function များ
        function bufferToBase64(buffer) {
            return btoa(String.fromCharCode.apply(null, new Uint8Array(buffer)));
        }
        function base64ToBuffer(base64) {
            var binary_string = window.atob(base64);
            var len = binary_string.length;
            var bytes = new Uint8Array(len);
            for (var i = 0; i < len; i++) { bytes[i] = binary_string.charCodeAt(i); }
            return bytes.buffer;
        }

        // Admin Panel ဝင်ရောက်ခြင်း စနစ်ကြီးတစ်ခုလုံး
        async function loginAdmin() {
            const panel = document.getElementById('adminPanel');
            
            if (panel.style.display === 'block') {
                panel.style.display = 'none';
                return;
            }

            // လက်ဗွေမှတ်တမ်း ရှိမရှိ စစ်ဆေးခြင်း
            const savedCredId = localStorage.getItem('kso_admin_cred_id');

            // HTTPS ဖြစ်ပြီး ဖုန်းမှာ လက်ဗွေမှတ်တမ်း ရှိထားပြီးသားဆိုရင် တိုက်ရိုက် လက်ဗွေတောင်းမည်
            if (window.PublicKeyCredential && window.isSecureContext && savedCredId) {
                try {
                    const challenge = new Uint8Array(32);
                    window.crypto.getRandomValues(challenge);

                    const publicKey = {
                        challenge: challenge,
                        allowCredentials: [{
                            id: base64ToBuffer(savedCredId),
                            type: 'public-key'
                        }],
                        timeout: 60000
                    };

                    const assertion = await navigator.credentials.get({ publicKey });
                    if (assertion) {
                        panel.style.display = 'block';
                        displayMessages();
                        return; // လက်ဗွေအောင်မြင်သဖြင့် ရပ်မည်
                    }
                } catch (err) {
                    console.log("Biometric login failed, falling back to password...", err);
                }
            }

            // လက်ဗွေစနစ် အလုပ်မလုပ်ပါက (သို့မဟုတ်) ပထမဆုံးအကြိမ်ဖြစ်ပါက Password တောင်းမည်
            const adminPass = prompt("Admin Password ကို ရိုက်ထည့်ပါ -");

            if (adminPass === "225775") {
                panel.style.display = 'block';
                displayMessages();

                // HTTPS ဖြစ်ပြီး လက်ဗွေ မမှတ်ရသေးရင် လက်ဗွေမှတ်ပုံတင်မလား မေးမည်
                if (window.PublicKeyCredential && window.isSecureContext && !savedCredId) {
                    setTimeout(async () => {
                        if (confirm("နောက်တစ်ကြိမ်တွင် Password မလိုဘဲ လက်ဗွေရာဖြင့် ဝင်ချင်ပါသလား?")) {
                            try {
                                const challenge = new Uint8Array(32);
                                window.crypto.getRandomValues(challenge);
                                const userId = new Uint8Array(16);
                                window.crypto.getRandomValues(userId);

                                const publicKey = {
                                    challenge: challenge,
                                    rp: { name: "KSOVIP Admin" },
                                    user: {
                                        id: userId,
                                        name: "admin@ksovip.com",
                                        displayName: "Admin"
                                    },
                                    pubKeyCredParams: [{ type: "public-key", alg: -7 }],
                                    authenticatorSelection: { authenticatorAttachment: "platform" },
                                    timeout: 60000
                                };

                                const credential = await navigator.credentials.create({ publicKey });
                                if (credential) {
                                    const credIdBase64 = bufferToBase64(credential.rawId);
                                    localStorage.setItem('kso_admin_cred_id', credIdBase64);
                                    alert("လက်ဗွေရာ မှတ်သားခြင်း အောင်မြင်ပါသည်။ နောက်တစ်ခေါက်မှစ၍ လက်ဗွေသုံးနိုင်ပါပြီ။");
                                }
                            } catch (e) {
                                alert("လက်ဗွေမှတ်သားခြင်း မအောင်မြင်ပါ။ ဖုန်းတွင် Lock ကောင်းမွန်စွာ ချထားရန် လိုအပ်ပါသည်။");
                            }
                        }
                    }, 500);
                }
            } else if (adminPass !== null) { 
                alert("လုံခြုံရေးကုဒ် မှားယွင်းနေပါသည်။ ရယူခွင့်မရှိပါ။");
            }
        }

        function saveMessage() {
            const msgInput = document.getElementById('userMessage');
            const msgText = msgInput.value.trim();

            if (msgText === '') {
                alert('ကျေးဇူးပြု၍ စာအရင်ရိုက်ပါ!');
                return;
            }

            const timeNow = new Date().toLocaleTimeString();
            const newMsg = { text: msgText, time: timeNow };

            try {
                let messages = JSON.parse(localStorage.getItem('kso_messages')) || [];
                messages.push(newMsg);
                localStorage.setItem('kso_messages', JSON.stringify(messages));
            } catch (e) {
                backupMessages.push(newMsg);
            }

            alert('စာသားပေးပို့ခြင်း အောင်မြင်ပါသည်။');
            msgInput.value = ''; 
            displayMessages();  
        }

        function displayMessages() {
            const messageList = document.getElementById('messageList');
            if (!messageList) return;

            let messages = [];
            try {
                messages = JSON.parse(localStorage.getItem('kso_messages')) || [];
            } catch (e) {
                messages = backupMessages;
            }

            if (messages.length === 0 && backupMessages.length > 0) {
                messages = backupMessages;
            }

            if (messages.length === 0) {
                messageList.innerHTML = '<p style="color: #aaa; font-size: 0.85rem; text-align:center;">စာမရှိသေးပါ။</p>';
                return;
            }

            const reversedMessages = [...messages].reverse();

            messageList.innerHTML = reversedMessages.map(msg => `
                <div class="msg-item">
                    <small style="color: #ff2b6d; font-size: 0.7rem; display:block;">🕒 ${msg.time}</small>
                    ${msg.text}
                </div>
            `).join('');
        }

        function clearMessages() {
            if(confirm('စာအားလုံးကို ဖျက်ပစ်မှာ သေချာပါသလား?')) {
                try {
                    localStorage.removeItem('kso_messages');
                } catch(e) {}
                backupMessages = [];
                displayMessages();
            }
        }
    </script>

</body>
</html>
